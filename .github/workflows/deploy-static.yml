# Ablage: Repo "reinstil/deploy-workflows" (öffentlich)  →  .github/workflows/deploy-static.yml
# Wiederverwendbarer Workflow für ALLE Kundenseiten (reines HTML oder Astro/Vite & Co.).
# Enthält keine Zugangsdaten – die kommen als Secrets/Variablen aus dem jeweiligen Kunden-Repo bzw. der Org.
#
# Build wird automatisch erkannt:
#   package.json mit "build"-Script → npm ci + npm run build, Upload von dist/
#   sonst                           → kein Build, Upload des Repo-Inhalts
#   (build_command / output_dir in deploy.yml überschreiben die Erkennung, falls nötig)
#
# Zugänge – Staging und Production haben getrennte cPanel-Konten und SSH-Schlüssel:
#
#   staging    Konto:   Variable STAGING_SSH_USER   (angelegt von reinstil/projekt-anlage)
#              Schlüssel: Secret STAGING_SSH_PRIVATE_KEY
#              Ziel:    ~/<STAGING_PATH>/, Standard public_html
#              URL:     Variable STAGING_URL (nur für die Anzeige im Run)
#
#   production Konto:   Variable PROD_SSH_USER      (erst beim Go-live setzen)
#              Schlüssel: Secret PROD_SSH_PRIVATE_KEY
#              Ziel:    ~/<PROD_PATH>/; ohne PROD_PATH wird Production übersprungen
#
#   Alte Einrichtung (vor den Staging-Konten) funktioniert weiter: Fehlen die obigen Angaben,
#   gelten ssh_user aus deploy.yml bzw. Variable SSH_USER, Secret SSH_PRIVATE_KEY und
#   für Staging die Variable STAGING_PATH.
#
#   Für alle: Server SSH_HOST/SSH_PORT (Input oder Variable) und Secret SSH_KNOWN_HOSTS.

name: Deploy static site

on:
  workflow_call:
    inputs:
      environment:        # "staging" oder "production"
        required: true
        type: string
      ssh_host:           # leer = Org-/Repo-Variable SSH_HOST
        required: false
        type: string
        default: ""
      ssh_user:           # nur alte Einrichtung: leer = Variable SSH_USER
        required: false
        type: string
        default: ""
      ssh_port:           # leer = Org-/Repo-Variable SSH_PORT, sonst 1988
        required: false
        type: string
        default: ""
      build_command:      # "auto" = erkennen; "" = kein Build; sonst eigener Befehl
        required: false
        type: string
        default: "auto"
      output_dir:         # "auto" = dist/ bei Build, sonst Repo-Root; sonst eigener Ordner
        required: false
        type: string
        default: "auto"
      node_version:       # Astro 7.4 braucht mindestens 22.23.4
        required: false
        type: string
        default: "24"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: true
    env:
      SSH_HOST: ${{ inputs.ssh_host || vars.SSH_HOST }}
      SSH_PORT: ${{ inputs.ssh_port || vars.SSH_PORT || '1988' }}
      # Konto je Umgebung; neue Variablen haben Vorrang vor der alten Einrichtung
      SSH_USER: ${{ inputs.environment == 'production' && (vars.PROD_SSH_USER || inputs.ssh_user || vars.SSH_USER) || (vars.STAGING_SSH_USER || inputs.ssh_user || vars.SSH_USER) }}

    steps:
      - uses: actions/checkout@v5

      - name: Projekt erkennen
        id: detect
        env:
          IN_BUILD: ${{ inputs.build_command }}
          IN_OUT: ${{ inputs.output_dir }}
        run: |
          HAS_BUILD_SCRIPT=false
          if [ -f package.json ] && node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            HAS_BUILD_SCRIPT=true
          fi

          if [ "$IN_BUILD" = "auto" ]; then
            if [ "$HAS_BUILD_SCRIPT" = true ]; then BUILD="npm run build"; else BUILD=""; fi
          else
            BUILD="$IN_BUILD"
          fi

          if [ "$IN_OUT" = "auto" ]; then
            if [ -n "$BUILD" ]; then OUT="dist"; else OUT="."; fi
          else
            OUT="$IN_OUT"
          fi

          LOCK=false
          [ -f package-lock.json ] && LOCK=true

          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "out=$OUT"     >> "$GITHUB_OUTPUT"
          echo "lock=$LOCK"   >> "$GITHUB_OUTPUT"
          if [ -n "$BUILD" ]; then
            echo "::notice::Build erkannt: '$BUILD' → Upload aus '$OUT/'"
          else
            echo "::notice::Kein Build – Upload des Repo-Inhalts"
          fi

      - name: Node einrichten
        if: steps.detect.outputs.build != ''
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ steps.detect.outputs.lock == 'true' && 'npm' || '' }}

      - name: Build
        if: steps.detect.outputs.build != ''
        env:
          BUILD: ${{ steps.detect.outputs.build }}
          OUT: ${{ steps.detect.outputs.out }}
        run: |
          if [ "${{ steps.detect.outputs.lock }}" = "true" ]; then
            npm ci
          else
            echo "::warning::Keine package-lock.json im Repo – nutze npm install. Bitte Lockfile committen."
            npm install
          fi
          $BUILD
          if [ ! -d "$OUT" ]; then
            echo "::error::Build lief durch, aber der Ordner '$OUT' fehlt. output_dir in deploy.yml setzen."
            exit 1
          fi

      - name: Zielpfad bestimmen
        id: target
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          PROD_PATH: ${{ vars.PROD_PATH }}
          STAGING_PATH: ${{ vars.STAGING_PATH }}
          STAGING_SSH_USER: ${{ vars.STAGING_SSH_USER }}
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          if [ "$ENVIRONMENT" = "production" ]; then
            if [ -z "$PROD_PATH" ]; then
              echo "::notice::PROD_PATH ist nicht gesetzt – Production-Deploy übersprungen."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            ZIEL="$PROD_PATH"
            echo "::notice::Production-Ziel: ${SSH_USER}:~/${ZIEL}"
          else
            if [ -n "$STAGING_PATH" ]; then
              ZIEL="$STAGING_PATH"
            elif [ -n "$STAGING_SSH_USER" ]; then
              ZIEL="public_html"
            else
              echo "::error::Kein Staging-Ziel: Variable STAGING_SSH_USER (Staging-Konto) oder STAGING_PATH fehlt. Projekt mit reinstil/projekt-anlage einrichten."
              exit 1
            fi
            echo "::notice::Staging-Ziel: ${SSH_USER}:~/${ZIEL}"
            [ -n "$STAGING_URL" ] && echo "::notice::Staging-URL: ${STAGING_URL}"
          fi
          # Schutz vor leeren oder absoluten Pfaden, rsync --delete würde sonst zu viel löschen
          case "$ZIEL" in
            ""|/*|*..*) echo "::error::Ungültiger Zielpfad '$ZIEL'"; exit 1 ;;
          esac
          echo "path=$ZIEL" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Konfiguration prüfen
        if: steps.target.outputs.skip != 'true'
        env:
          HAS_KEY: ${{ (inputs.environment == 'production' && (secrets.PROD_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY) || (secrets.STAGING_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY)) != '' }}
          HAS_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS != '' }}
        run: |
          ok=true
          [ -z "$SSH_HOST" ] && echo "::error::SSH_HOST fehlt (deploy.yml oder Variable SSH_HOST)" && ok=false
          [ -z "$SSH_USER" ] && echo "::error::SSH-Benutzer fehlt (STAGING_SSH_USER / PROD_SSH_USER bzw. ssh_user)" && ok=false
          [ "$HAS_KEY" != "true" ] && echo "::error::SSH-Schlüssel fehlt (Secret STAGING_SSH_PRIVATE_KEY / PROD_SSH_PRIVATE_KEY bzw. SSH_PRIVATE_KEY)" && ok=false
          [ "$HAS_HOSTS" != "true" ] && echo "::error::Secret SSH_KNOWN_HOSTS fehlt (Repo oder Org)" && ok=false
          [ "$ok" = true ]

      - name: SSH einrichten
        if: steps.target.outputs.skip != 'true'
        env:
          SSH_KEY: ${{ inputs.environment == 'production' && (secrets.PROD_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY) || (secrets.STAGING_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY) }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload per rsync
        if: steps.target.outputs.skip != 'true'
        env:
          OUT: ${{ steps.detect.outputs.out }}
          ZIEL: ${{ steps.target.outputs.path }}
        run: |
          # Quellcode-Dateien nie hochladen, falls ohne Build aus dem Repo-Root deployt wird
          # P = auf dem Server vor dem Löschen schützen (Passwortschutz, SSL-Validierung)
          rsync -az --delete \
            --exclude='.git*' \
            --exclude='node_modules' \
            --exclude='CLAUDE.md' \
            --exclude='.claude' \
            --exclude='README.md' \
            --filter='P .htaccess' \
            --filter='P .well-known' \
            -e "ssh -p ${SSH_PORT} -i ~/.ssh/id_ed25519" \
            "${OUT}/" \
            "${SSH_USER}@${SSH_HOST}:${ZIEL}/"
